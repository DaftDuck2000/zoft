[workspace]
resolver = "2"
members = [
    "daw-core",
    "daw-engine",
    "daw-ui",
    "daw-plugins",
    "xtask",
    "zoft-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/amy/zoft"
description = "Zoft - Professional Digital Audio Workstation"
authors = ["Amy <amy@example.com>"]
categories = ["audio", "multimedia", "gui"]
keywords = ["daw", "audio", "music", "production"]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
config = "0.14"
uuid = { version = "1.17", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
lz4_flex = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
slotmap = { version = "1.0", features = ["serde"] }
generational-arena = "0.2"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Audio
cpal = { version = "0.15", default-features = false }
jack = "0.6"
# pipewire = "0.5"  # Has compatibility issues with spa crate
midir = "0.9"
midly = "0.5"
hound = "3.5"
rubberband = "0.1"  # FFI to librubberband
# dasample = "0.2"  # Check if available
fundsp = "0.16"
dasp = "0.11"
# packed_simd = "0.3"  # Nightly only
# std-simd = "0.1"  # Nightly only

# DSP
# nih-plug = { version = "0.2", features = ["clap", "vst3", "nih-plug-vst3-sys"] }  # Not on crates.io
vst3-sys = "0.7"
# cpdal = "0.1"  # Plugin hosting - not on crates.io

# UI
egui = "0.29"
eframe = "0.29"
# iced = { version = "0.12", features = ["wgpu", "image", "tokio"] }  # Conflicts with eframe
wgpu = "0.19"
raw-window-handle = "0.6"
image = "0.24"

# Async
tokio = { version = "1.0", features = ["full"] }
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "5.0"
arc-swap = "1.0"

# Utils
dirs = "5.0"
notify = "6.0"
walkdir = "2.0"
glob = "0.3"
toml = "0.8"
ron = "0.8"
rand = "0.8"
num_traits = { package = "num-traits", version = "0.2" }
time = { version = "0.3", features = ["formatting", "macros"] }
libudev = { version = "0.2" }

# Optional PipeWire support (enabled via daw-engine feature)
pipewire = { version = "0.10" }
spa = { version = "0.5" }

# Profiling
tracy-client = "0.16"
pprof = "0.12"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
debug = true

[profile.test]
opt-level = 2
debug = true